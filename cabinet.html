<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rendz — Cabinet</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800;900&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:       #f7f3ee;
      --bg2:      #f0ebe3;
      --cream:    #ede8e0;
      --blue:     #2563eb;
      --blue-mid: #3b82f6;
      --blue-dim: rgba(37,99,235,0.08);
      --blue-border: rgba(37,99,235,0.18);
      --blue-text: #1d4ed8;
      --white:    #ffffff;
      --text:     #1c1917;
      --text-sub: #78716c;
      --text-muted: #a8a29e;
      --border:   rgba(0,0,0,0.07);
      --shadow:   0 2px 16px rgba(0,0,0,0.07);
      --shadow-lg:0 8px 32px rgba(0,0,0,0.10);
      --green:    #16a34a;
      --green-dim:rgba(22,163,74,0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 32px 20px 48px;
    }

    /* Fond doux */
    body::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse 70% 50% at 50% 0%, rgba(37,99,235,0.06) 0%, transparent 60%),
        radial-gradient(ellipse 40% 30% at 90% 90%, rgba(37,99,235,0.04) 0%, transparent 50%);
    }

    .container { width: 100%; max-width: 390px; position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; }

    @keyframes fadeUp { from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);} }
    @keyframes fadeIn { from{opacity:0;}to{opacity:1;} }
    @keyframes glow { 0%,100%{box-shadow:0 0 16px rgba(37,99,235,0.25);}50%{box-shadow:0 0 28px rgba(37,99,235,0.4);} }
    @keyframes pulse { 0%,100%{opacity:1;}50%{opacity:0.4;} }
    @keyframes shimmer { 0%{background-position:200% 0}100%{background-position:-200% 0} }

    /* LOGO */
    .logo-wrap {
      display: flex; align-items: center; gap: 9px;
      margin-bottom: 36px;
      animation: fadeIn 0.5s ease both;
    }
    .logo-icon {
      width: 38px; height: 38px;
      background: linear-gradient(140deg, #2563eb, #1d4ed8);
      border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
      animation: glow 3s ease-in-out infinite;
    }
    .logo-text { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 800; color: var(--text); letter-spacing: -0.5px; }
    .logo-text span { color: var(--blue); }

    /* DOCTOR HERO */
    .doctor-hero {
      width: 100%; text-align: center;
      margin-bottom: 28px;
      animation: fadeUp 0.6s 0.1s ease both; opacity: 0; animation-fill-mode: forwards;
    }
    .doctor-avatar {
      width: 68px; height: 68px;
      background: white;
      border: 2px solid var(--blue-border);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 30px;
      margin: 0 auto 14px;
      box-shadow: var(--shadow);
    }
    .doctor-name { font-size: 22px; font-weight: 800; color: var(--text); letter-spacing: -0.4px; margin-bottom: 6px; }
    .doctor-spec {
      display: inline-flex; align-items: center;
      background: var(--blue-dim); border: 1px solid var(--blue-border);
      border-radius: 20px; padding: 4px 14px;
      font-size: 12px; font-weight: 600; color: var(--blue-text);
      margin-bottom: 6px;
    }
    .doctor-horaires { font-size: 12px; color: var(--text-sub); }

    /* LIVE */
    .live-bar {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      margin-bottom: 24px;
      animation: fadeUp 0.6s 0.2s ease both; opacity: 0; animation-fill-mode: forwards;
    }
    .live-pill {
      display: flex; align-items: center; gap: 6px;
      background: var(--green-dim); border: 1px solid rgba(22,163,74,0.2);
      border-radius: 20px; padding: 5px 12px;
    }
    .live-dot { width: 6px; height: 6px; background: var(--green); border-radius: 50%; animation: pulse 1.8s infinite; }
    .live-label { font-size: 11px; font-weight: 700; color: var(--green); text-transform: uppercase; letter-spacing: 0.3px; }
    .num-display { font-size: 13px; color: var(--text-sub); }
    .num-display strong { font-size: 20px; font-weight: 800; color: var(--text); font-family: 'Outfit', sans-serif; }

    /* MESSAGE */
    .message-box {
      width: 100%;
      background: #fffbeb; border: 1px solid #fde68a;
      border-radius: 12px; padding: 10px 16px;
      font-size: 12px; color: #92400e; font-weight: 500;
      text-align: center; margin-bottom: 16px; display: none;
    }

    /* CARTE PATIENT */
    .patient-card {
      width: 100%;
      background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 60%, #3b82f6 100%);
      border-radius: 20px; padding: 22px 20px;
      display: flex; align-items: center; gap: 16px;
      cursor: pointer; text-decoration: none;
      margin-bottom: 10px;
      box-shadow: 0 8px 28px rgba(29,78,216,0.3), 0 0 0 1px rgba(255,255,255,0.1) inset;
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative; overflow: hidden;
      animation: fadeUp 0.6s 0.25s ease both; opacity: 0; animation-fill-mode: forwards;
    }
    .patient-card::before {
      content: '';
      position: absolute; top: -50%; right: -15%;
      width: 180px; height: 180px;
      background: radial-gradient(circle, rgba(255,255,255,0.12) 0%, transparent 65%);
      pointer-events: none;
    }
    .patient-card:hover { transform: translateY(-2px); box-shadow: 0 14px 40px rgba(29,78,216,0.4); }
    .patient-card:active { transform: scale(0.99); }

    .patient-icon {
      width: 50px; height: 50px;
      background: rgba(255,255,255,0.18);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .patient-body { flex: 1; position: relative; z-index: 1; }
    .patient-title { font-size: 17px; font-weight: 800; color: white; letter-spacing: -0.3px; margin-bottom: 2px; }
    .patient-sub { font-size: 12px; color: rgba(255,255,255,0.7); }
    .patient-arrow {
      width: 34px; height: 34px;
      background: rgba(255,255,255,0.18);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 15px; transition: all 0.2s; flex-shrink: 0;
    }
    .patient-card:hover .patient-arrow { background: rgba(255,255,255,0.28); transform: translateX(2px); }

    /* STAFF */
    .staff-section {
      width: 100%;
      animation: fadeUp 0.6s 0.35s ease both; opacity: 0; animation-fill-mode: forwards;
    }
    .staff-label {
      font-size: 10px; font-weight: 600; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.8px;
      text-align: center; margin-bottom: 8px;
    }
    .staff-cards { display: flex; gap: 8px; }
    .staff-card {
      flex: 1; background: white;
      border: 1px solid var(--border);
      border-radius: 16px; padding: 14px 10px;
      display: flex; flex-direction: column; align-items: center; gap: 7px;
      cursor: pointer; text-decoration: none;
      transition: all 0.2s;
      box-shadow: var(--shadow);
    }
    .staff-card:hover { border-color: var(--blue-border); box-shadow: var(--shadow-lg); transform: translateY(-2px); }
    .staff-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 17px; transition: transform 0.2s; }
    .staff-card:hover .staff-icon { transform: scale(1.1); }
    .staff-card-ass .staff-icon { background: #fff7ed; }
    .staff-card-med .staff-icon { background: #f0fdf4; }
    .staff-title { font-size: 12px; font-weight: 700; color: var(--text); }
    .staff-sub { font-size: 10px; color: var(--text-sub); }

    /* FOOTER */
    .footer {
      margin-top: 28px; font-size: 11px; color: var(--text-muted);
      animation: fadeIn 0.6s 0.5s ease both; opacity: 0; animation-fill-mode: forwards;
    }
    .footer span { color: var(--blue); font-weight: 600; }

    /* SKELETON */
    .skeleton { background: linear-gradient(90deg, var(--cream) 25%, var(--bg2) 50%, var(--cream) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; }
    .skel-avatar { width: 68px; height: 68px; border-radius: 50%; margin: 0 auto 14px; }
    .skel-name { height: 20px; width: 170px; margin: 0 auto 8px; }
    .skel-spec { height: 24px; width: 110px; border-radius: 20px; margin: 0 auto; }

    @media (max-width: 400px) {
      .doctor-name { font-size: 19px; }
      .patient-title { font-size: 15px; }
    }
  </style>
</head>
<body>
<div class="container">

  <div class="logo-wrap">
    <div class="logo-icon">
      <svg width="20" height="20" viewBox="0 0 22 22" fill="none">
        <path d="M5 3C5 3 3 3 3 6C3 9 5 9 5 12C5 15.3137 7.68629 18 11 18C14.3137 18 17 15.3137 17 12V10" stroke="white" stroke-width="1.9" stroke-linecap="round"/>
        <circle cx="17" cy="8" r="2.2" stroke="white" stroke-width="1.9"/>
        <path d="M3 6C3 5 2.5 4.5 3 3.5C3.5 3 4.5 3 5 3" stroke="white" stroke-width="1.9" stroke-linecap="round"/>
        <path d="M5 3C5.5 3 6.5 3 7 4C7.5 5 6.5 5.5 6 5" stroke="white" stroke-width="1.9" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="logo-text">Rend<span>z</span></div>
  </div>

  <!-- DOCTOR -->
  <div class="doctor-hero">
    <div id="skeletonWrap">
      <div class="skeleton skel-avatar"></div>
      <div class="skeleton skel-name"></div>
      <div class="skeleton skel-spec" style="margin-top:8px"></div>
    </div>
    <div id="doctorInfo" style="display:none">
      <div class="doctor-avatar">👨‍⚕️</div>
      <div class="doctor-name" id="cabinetName"></div>
      <div class="doctor-spec" id="cabinetSpec"></div>
      <div class="doctor-horaires" id="cabinetHoraires"></div>
    </div>
  </div>

  <!-- LIVE -->
  <div class="live-bar">
    <div class="live-pill">
      <div class="live-dot"></div>
      <div class="live-label">Live</div>
    </div>
    <div class="num-display">N° en cours &nbsp;<strong id="numEnCours">—</strong></div>
  </div>

  <div class="message-box" id="messageBox"></div>

  <!-- PATIENT -->
  <a class="patient-card" id="linkPatient" href="#">
    <div class="patient-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" stroke="white" stroke-width="2" stroke-linecap="round"/>
        <circle cx="9" cy="7" r="4" stroke="white" stroke-width="2"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87" stroke="white" stroke-width="2" stroke-linecap="round"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75" stroke="white" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="patient-body">
      <div class="patient-title">Salle d'attente</div>
      <div class="patient-sub">Inscrivez-vous pour obtenir votre numéro</div>
    </div>
    <div class="patient-arrow">→</div>
  </a>

  <!-- STAFF -->
  <div class="staff-section">
    <div class="staff-label">Accès personnel</div>
    <div class="staff-cards">
      <a class="staff-card staff-card-ass" id="linkAssistante" href="#">
        <div class="staff-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 12l2 2 4-4" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="9" stroke="#f97316" stroke-width="1.6"/></svg>
        </div>
        <div class="staff-title">Assistante</div>
        <div class="staff-sub">File d'attente</div>
      </a>
      <a class="staff-card staff-card-med" id="linkMedecin" href="#">
        <div class="staff-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M22 12h-4l-3 9L9 3l-3 9H2" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="staff-title">Médecin</div>
        <div class="staff-sub">Tableau de bord</div>
      </a>
    </div>
  </div>

  <div class="footer">© 2026 <span>Rendz</span></div>
</div>

<script>
  const SUPABASE_URL = 'https://rynxvdqjplqccekulcfe.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5bnh2ZHFqcGxxY2Nla3VsY2ZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxNDY5ODQsImV4cCI6MjA4NzcyMjk4NH0.Ab-HQgVhGzxdyXbY8xeFF0HveQGxstNgEIUeELVPWk8';
  const cabinetId = new URLSearchParams(window.location.search).get('id') || 'cabinet-001';
  const base = window.location.href.replace(/cabinet\.html.*/, '');
  document.getElementById('linkPatient').href    = `${base}patient.html?id=${cabinetId}`;
  document.getElementById('linkAssistante').href = `${base}assistante.html?id=${cabinetId}`;
  document.getElementById('linkMedecin').href    = `${base}medecin.html?id=${cabinetId}`;

  async function loadInfos() {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/parametres?cabinet_id=eq.${cabinetId}`, {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
      });
      const data = await res.json();
      document.getElementById('skeletonWrap').style.display = 'none';
      if (data.length > 0) {
        const p = data[0];
        if (p.nom_cabinet) {
          document.getElementById('cabinetName').textContent = p.nom_cabinet;
          const specEl = document.getElementById('cabinetSpec');
          specEl.textContent = p.specialite || '';
          specEl.style.display = p.specialite ? 'inline-flex' : 'none';
          document.getElementById('cabinetHoraires').textContent = p.horaires || '';
          document.getElementById('doctorInfo').style.display = 'block';
          document.title = `Rendz — ${p.nom_cabinet}`;
        }
        document.getElementById('numEnCours').textContent = p.numero_en_cours || '—';
        if (p.message_patients) {
          document.getElementById('messageBox').textContent = '📢 ' + p.message_patients;
          document.getElementById('messageBox').style.display = 'block';
        }
      }
    } catch(e) {
      document.getElementById('skeletonWrap').style.display = 'none';
    }
  }
  loadInfos();
  setInterval(loadInfos, 20000);
</script>
</body>
</html>
