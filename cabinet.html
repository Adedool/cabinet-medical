<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rendz — Cabinet</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --blue: #1a56db; --blue-dark: #1341b0; --blue-light: #e8f0fe;
      --white: #ffffff; --gray-50: #f8fafc; --gray-100: #f1f5f9;
      --gray-200: #e2e8f0; --gray-400: #94a3b8; --gray-500: #64748b;
      --gray-700: #334155; --gray-900: #0f172a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--gray-50);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* Fond décoratif */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% 20%, rgba(26,86,219,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(26,86,219,0.05) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
    }

    /* HEADER */
    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 36px;
      font-weight: 800;
      color: var(--blue);
      letter-spacing: -1px;
      line-height: 1;
    }
    .logo span { color: var(--gray-900); }

    .cabinet-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--gray-900);
      margin-top: 16px;
      line-height: 1.3;
    }
    .cabinet-spec {
      font-size: 13px;
      color: var(--gray-500);
      margin-top: 4px;
      font-weight: 500;
    }
    .cabinet-horaires {
      font-size: 12px;
      color: var(--gray-400);
      margin-top: 3px;
    }

    .divider {
      width: 40px;
      height: 3px;
      background: var(--blue);
      border-radius: 2px;
      margin: 16px auto 0;
    }

    /* CARDS */
    .cards {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: white;
      border-radius: 16px;
      border: 1.5px solid var(--gray-200);
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 18px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      position: relative;
      overflow: hidden;
    }

    .card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--blue);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .card:hover {
      border-color: var(--blue);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(26,86,219,0.15);
    }

    .card:active { transform: translateY(0); }

    .card-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
      transition: transform 0.2s;
    }
    .card:hover .card-icon { transform: scale(1.08); }

    .card-patient .card-icon { background: var(--blue-light); }
    .card-assistante .card-icon { background: #fff7ed; }
    .card-medecin .card-icon { background: #f0fdf4; }

    .card-body { flex: 1; }
    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--gray-900);
      margin-bottom: 3px;
    }
    .card-sub {
      font-size: 12px;
      color: var(--gray-500);
      font-weight: 400;
    }

    .card-arrow {
      color: var(--gray-300);
      font-size: 18px;
      transition: all 0.2s;
    }
    .card:hover .card-arrow {
      color: var(--blue);
      transform: translateX(3px);
    }

    /* Statut live */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }
    .live-dot {
      width: 8px; height: 8px;
      background: #4ade80;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
    .status-text {
      font-size: 12px;
      color: var(--gray-500);
      font-weight: 500;
    }
    .status-num {
      font-size: 12px;
      font-weight: 700;
      color: var(--blue);
    }

    /* Message patients */
    .message-box {
      background: #fff8e1;
      border: 1.5px solid #ffd54f;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 13px;
      color: #5f4700;
      font-weight: 500;
      text-align: center;
      margin-bottom: 16px;
      display: none;
    }

    .footer {
      text-align: center;
      margin-top: 28px;
      font-size: 11px;
      color: var(--gray-400);
    }
    .footer span { color: var(--blue); font-weight: 600; }

    /* Skeleton loader */
    .skeleton { background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 6px; }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    .skel-name { height: 20px; width: 180px; margin: 16px auto 6px; }
    .skel-spec { height: 14px; width: 120px; margin: 0 auto; }

    @media (max-width: 480px) {
      .logo { font-size: 30px; }
      .card { padding: 16px 18px; }
      .card-icon { width: 46px; height: 46px; font-size: 20px; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="logo">Rend<span>z</span></div>

    <div id="skeletonName" class="skeleton skel-name"></div>
    <div id="skeletonSpec" class="skeleton skel-spec" style="margin-top:6px"></div>

    <div id="cabinetInfo" style="display:none">
      <div class="cabinet-name" id="cabinetName"></div>
      <div class="cabinet-spec" id="cabinetSpec"></div>
      <div class="cabinet-horaires" id="cabinetHoraires"></div>
    </div>
    <div class="divider"></div>
  </div>

  <div class="status-bar">
    <div class="live-dot"></div>
    <div class="status-text">Numéro en cours :</div>
    <div class="status-num" id="numEnCours">—</div>
  </div>

  <div class="message-box" id="messageBox"></div>

  <div class="cards">
    <a class="card card-patient" id="linkPatient" href="#">
      <div class="card-icon">🏥</div>
      <div class="card-body">
        <div class="card-title">Salle d'attente</div>
        <div class="card-sub">S'inscrire et suivre la file</div>
      </div>
      <div class="card-arrow">→</div>
    </a>

    <a class="card card-assistante" id="linkAssistante" href="#">
      <div class="card-icon">👩‍⚕️</div>
      <div class="card-body">
        <div class="card-title">Espace Assistante</div>
        <div class="card-sub">Gérer la file d'attente</div>
      </div>
      <div class="card-arrow">→</div>
    </a>

    <a class="card card-medecin" id="linkMedecin" href="#">
      <div class="card-icon">👨‍⚕️</div>
      <div class="card-body">
        <div class="card-title">Espace Médecin</div>
        <div class="card-sub">Tableau de bord et paramètres</div>
      </div>
      <div class="card-arrow">→</div>
    </a>
  </div>

  <div class="footer">© 2026 <span>Rendz</span></div>
</div>

<script>
  const SUPABASE_URL = 'https://rynxvdqjplqccekulcfe.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5bnh2ZHFqcGxxY2Nla3VsY2ZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxNDY5ODQsImV4cCI6MjA4NzcyMjk4NH0.Ab-HQgVhGzxdyXbY8xeFF0HveQGxstNgEIUeELVPWk8';

  const cabinetId = new URLSearchParams(window.location.search).get('id') || 'cabinet-001';

  // Construire les liens
  const base = window.location.href.replace(/cabinet\.html.*/, '');
  document.getElementById('linkPatient').href    = `${base}patient.html?id=${cabinetId}`;
  document.getElementById('linkAssistante').href = `${base}assistante.html?id=${cabinetId}`;
  document.getElementById('linkMedecin').href    = `${base}medecin.html?id=${cabinetId}`;

  async function loadInfos() {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/parametres?cabinet_id=eq.${cabinetId}`, {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
      });
      const data = await res.json();

      // Cacher skeletons
      document.getElementById('skeletonName').style.display = 'none';
      document.getElementById('skeletonSpec').style.display = 'none';

      if (data.length > 0) {
        const p = data[0];

        // Nom cabinet
        const nom = p.nom_cabinet || '';
        if (nom) {
          document.getElementById('cabinetName').textContent = nom;
          document.getElementById('cabinetSpec').textContent = p.specialite || '';
          document.getElementById('cabinetHoraires').textContent = p.horaires || '';
          document.getElementById('cabinetInfo').style.display = 'block';
          document.title = `Rendz — ${nom}`;
        }

        // Numéro en cours
        document.getElementById('numEnCours').textContent = p.numero_en_cours || '—';

        // Message patients
        const msg = p.message_patients || '';
        if (msg) {
          document.getElementById('messageBox').textContent = '📢 ' + msg;
          document.getElementById('messageBox').style.display = 'block';
        }
      }
    } catch(e) {
      document.getElementById('skeletonName').style.display = 'none';
      document.getElementById('skeletonSpec').style.display = 'none';
    }
  }

  loadInfos();
  setInterval(loadInfos, 20000);
</script>
</body>
</html>
