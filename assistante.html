<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rendz — Assistante</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:          #f7f3ee;
      --bg2:         #f0ebe3;
      --cream:       #ede8e0;
      --blue:        #2563eb;
      --blue-dim:    rgba(37,99,235,0.08);
      --blue-border: rgba(37,99,235,0.18);
      --blue-text:   #1d4ed8;
      --white:       #ffffff;
      --text:        #1c1917;
      --text-sub:    #78716c;
      --text-muted:  #a8a29e;
      --border:      rgba(0,0,0,0.07);
      --shadow:      0 2px 12px rgba(0,0,0,0.06);
      --shadow-lg:   0 8px 28px rgba(0,0,0,0.10);
      --green:       #16a34a;
      --green-light: #f0fdf4;
      --green-border:#bbf7d0;
      --orange:      #ea580c;
      --orange-light:#fff7ed;
      --orange-border:#fed7aa;
      --red:         #dc2626;
      --red-light:   #fef2f2;
      --red-border:  #fecaca;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background: var(--bg); min-height: 100vh; }

    @keyframes fadeUp { from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);} }
    @keyframes pulse  { 0%,100%{opacity:1;}50%{opacity:0.3;} }
    @keyframes glow   { 0%,100%{box-shadow:0 0 16px rgba(37,99,235,0.25);}50%{box-shadow:0 0 28px rgba(37,99,235,0.4);} }

    /* ── LOGIN ── */
    .login-wrap {
      min-height: 100vh; display: flex; align-items: center;
      justify-content: center; padding: 20px; background: var(--bg);
    }
    .login-card {
      background: white; border-radius: 22px; padding: 40px 36px;
      width: 100%; max-width: 380px;
      box-shadow: var(--shadow-lg); border: 1px solid var(--border);
      text-align: center;
      animation: fadeUp 0.5s ease both;
    }
    .login-logo-wrap { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .login-logo-icon {
      width: 34px; height: 34px;
      background: linear-gradient(140deg, #2563eb, #1d4ed8);
      border-radius: 10px; display: flex; align-items: center; justify-content: center;
      animation: glow 3s ease-in-out infinite;
    }
    .login-logo-text { font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 800; color: var(--text); letter-spacing: -0.5px; }
    .login-logo-text span { color: var(--blue); }
    .login-role-icon { font-size: 36px; margin: 16px 0 8px; }
    .login-role { font-size: 13px; color: var(--text-sub); margin-bottom: 24px; font-weight: 500; }
    .login-input {
      width: 100%; padding: 12px 14px; border: 1.5px solid var(--border);
      border-radius: 11px; font-family: 'Outfit', sans-serif; font-size: 15px;
      color: var(--text); background: var(--bg); margin-bottom: 12px; outline: none;
    }
    .login-input:focus { border-color: var(--blue); background: white; }
    .login-btn {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #1d4ed8, #2563eb);
      color: white; border: none; border-radius: 11px;
      font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 700;
      cursor: pointer; box-shadow: 0 4px 16px rgba(29,78,216,0.3);
    }
    .login-btn:hover { transform: translateY(-1px); }
    .login-err { color: var(--red); font-size: 13px; margin-top: 10px; display: none; font-weight: 500; }

    /* ── DASHBOARD ── */
    .dashboard { display: none; }

    .topbar {
      background: white; border-bottom: 1px solid var(--border);
      padding: 12px 24px; display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 10;
      box-shadow: 0 1px 8px rgba(0,0,0,0.04);
    }
    .topbar-logo-wrap { display: flex; align-items: center; gap: 7px; }
    .topbar-logo-icon {
      width: 28px; height: 28px; background: linear-gradient(140deg, #2563eb, #1d4ed8);
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
    }
    .topbar-logo-text { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 800; color: var(--text); letter-spacing: -0.3px; }
    .topbar-logo-text span { color: var(--blue); }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .topbar-date { font-size: 12px; color: var(--text-sub); font-weight: 500; }
    .live-dot { width: 7px; height: 7px; background: #4ade80; border-radius: 50%; display: inline-block; animation: pulse 1.5s infinite; }
    .logout-btn {
      padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border);
      background: white; color: var(--text-sub);
      font-family: 'Outfit', sans-serif; font-size: 12px; font-weight: 500; cursor: pointer;
    }
    .logout-btn:hover { border-color: var(--red); color: var(--red); }

    /* CONSULT BAR */
    .consult-bar {
      background: linear-gradient(135deg, #ea580c, #f97316);
      padding: 16px 24px; display: flex; align-items: center;
      justify-content: space-between; flex-wrap: wrap; gap: 12px;
    }
    .consult-label { font-size: 10px; color: rgba(255,255,255,0.75); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
    .consult-number { font-family: 'Outfit', sans-serif; font-size: 38px; font-weight: 900; color: white; line-height: 1; letter-spacing: -1px; }
    .consult-name { font-size: 13px; color: rgba(255,255,255,0.85); margin-top: 3px; }
    .fin-btn {
      background: white; color: var(--orange); border: none; border-radius: 10px;
      padding: 10px 20px; font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 700;
      cursor: pointer; transition: all 0.15s;
    }
    .fin-btn:hover { background: var(--text); color: white; }
    .no-consult {
      background: var(--cream); border-bottom: 1px solid var(--border);
      padding: 11px 24px; font-size: 13px; color: var(--text-sub);
      display: flex; align-items: center; gap: 8px; font-weight: 500;
    }

    /* STATS */
    .stats-row { display: flex; gap: 10px; padding: 18px 24px 0; flex-wrap: wrap; }
    .stat-card {
      background: white; border-radius: 12px; padding: 14px 16px;
      flex: 1; min-width: 90px; border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .stat-val { font-family: 'Outfit', sans-serif; font-size: 26px; font-weight: 800; color: var(--blue); }
    .stat-lbl { font-size: 11px; color: var(--text-sub); margin-top: 2px; font-weight: 500; }

    /* CONTENT */
    .content { padding: 18px 24px; }
    .two-col { display: grid; grid-template-columns: 1fr 300px; gap: 18px; align-items: start; }
    .section-title { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .refresh-btn {
      border: 1.5px solid var(--border); background: white; color: var(--text-sub);
      border-radius: 8px; padding: 4px 11px; font-size: 12px; cursor: pointer;
      font-family: 'Outfit', sans-serif; font-weight: 500;
    }
    .refresh-btn:hover { border-color: var(--blue); color: var(--blue); }

    /* LIST */
    .list-wrap { background: white; border-radius: 14px; border: 1px solid var(--border); overflow: hidden; box-shadow: var(--shadow); }
    .list-header {
      display: grid; grid-template-columns: 46px 1fr 110px 210px;
      padding: 10px 18px; background: var(--bg);
      border-bottom: 1px solid var(--border);
      font-size: 11px; font-weight: 600; color: var(--text-sub);
      text-transform: uppercase; letter-spacing: 0.3px;
    }
    .list-item {
      display: grid; grid-template-columns: 46px 1fr 110px 210px;
      padding: 12px 18px; border-bottom: 1px solid var(--cream);
      align-items: center; transition: background 0.1s;
    }
    .list-item:last-child { border-bottom: none; }
    .list-item:hover { background: var(--bg); }
    .list-item.en_cours { background: var(--orange-light); border-left: 3px solid var(--orange); }
    .list-item.absent { opacity: 0.5; }
    .list-item.termine { opacity: 0.4; }
    .list-item.manuel { border-left: 3px solid var(--blue); }

    .num-badge {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 13px; color: white; background: var(--blue);
    }
    .num-badge.present  { background: var(--green); }
    .num-badge.en_cours { background: var(--orange); }
    .num-badge.absent   { background: var(--text-muted); }
    .num-badge.termine  { background: var(--cream); color: var(--text-muted); }

    .name-col { font-weight: 600; color: var(--text); font-size: 14px; }
    .name-col .tel { font-size: 12px; color: var(--text-sub); font-weight: 400; margin-top: 1px; }
    .name-col .tag-manuel { font-size: 10px; background: var(--blue-dim); color: var(--blue); border-radius: 4px; padding: 1px 6px; margin-left: 6px; font-weight: 600; }

    .status-badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .status-badge.en_attente { background: var(--bg2); color: var(--text-sub); }
    .status-badge.present    { background: var(--green-light); color: var(--green); }
    .status-badge.en_cours   { background: var(--orange-light); color: var(--orange); }
    .status-badge.absent     { background: var(--bg2); color: var(--text-muted); }
    .status-badge.termine    { background: var(--bg2); color: var(--text-muted); }

    .actions-col { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
    .action-btn { border: none; border-radius: 7px; padding: 5px 10px; font-size: 11px; cursor: pointer; font-family: 'Outfit', sans-serif; font-weight: 600; transition: all 0.12s; white-space: nowrap; }
    .btn-present { background: var(--green-light); color: var(--green); border: 1px solid var(--green-border); }
    .btn-present:hover { background: var(--green); color: white; }
    .btn-encours { background: var(--orange-light); color: var(--orange); border: 1px solid var(--orange-border); }
    .btn-encours:hover { background: var(--orange); color: white; }
    .btn-fin { background: var(--green); color: white; border: 1px solid var(--green); }
    .btn-fin:hover { background: #15803d; }
    .btn-absent { background: var(--bg2); color: var(--text-sub); border: 1px solid var(--border); }
    .btn-absent:hover { background: var(--text-muted); color: white; }
    .btn-restore { background: var(--blue-dim); color: var(--blue); border: 1px solid var(--blue-border); }
    .btn-restore:hover { background: var(--blue); color: white; }
    .btn-del { background: var(--red-light); color: var(--red); border: 1px solid var(--red-border); }
    .btn-del:hover { background: var(--red); color: white; }

    .empty-state { text-align: center; padding: 48px 20px; color: var(--text-muted); }
    .empty-state .ico { font-size: 36px; margin-bottom: 10px; }
    .empty-state p { font-size: 14px; }

    /* MANUAL FORM */
    .manual-form {
      background: white; border-radius: 16px; border: 1px solid var(--border);
      padding: 20px; position: sticky; top: 70px;
      box-shadow: var(--shadow);
    }
    .manual-form h3 { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 16px; }
    .mform-group { margin-bottom: 11px; }
    .mform-label { display: block; font-size: 10px; font-weight: 600; color: var(--text-sub); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.4px; }
    .mform-input {
      width: 100%; padding: 10px 12px; border: 1.5px solid var(--border);
      border-radius: 9px; font-family: 'Outfit', sans-serif; font-size: 14px;
      color: var(--text); background: var(--bg); outline: none;
    }
    .mform-input:focus { border-color: var(--blue); background: white; }
    .add-btn {
      width: 100%; padding: 11px; background: var(--text); color: white;
      border: none; border-radius: 9px; font-family: 'Outfit', sans-serif;
      font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 4px;
      transition: background 0.15s;
    }
    .add-btn:hover { background: var(--blue); }
    .add-btn:disabled { background: var(--cream); color: var(--text-muted); cursor: not-allowed; }
    .add-success {
      background: var(--green-light); border: 1px solid var(--green-border);
      border-radius: 9px; padding: 10px 12px; color: var(--green);
      font-size: 13px; font-weight: 600; text-align: center; margin-top: 10px; display: none;
    }

    /* MODAL */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(28,25,23,0.4);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .modal-overlay.show { opacity: 1; pointer-events: all; }
    .modal {
      background: white; border-radius: 18px; padding: 28px 24px;
      max-width: 340px; width: 100%; box-shadow: var(--shadow-lg);
      transform: scale(0.95); transition: transform 0.2s;
    }
    .modal-overlay.show .modal { transform: scale(1); }
    .modal-icon { font-size: 32px; text-align: center; margin-bottom: 10px; }
    .modal-title { font-size: 16px; font-weight: 700; color: var(--text); text-align: center; margin-bottom: 7px; }
    .modal-msg { font-size: 13px; color: var(--text-sub); text-align: center; line-height: 1.5; margin-bottom: 20px; }
    .modal-actions { display: flex; gap: 10px; }
    .modal-cancel {
      flex: 1; padding: 11px; background: var(--bg); color: var(--text-sub);
      border: 1px solid var(--border); border-radius: 10px;
      font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .modal-cancel:hover { background: var(--cream); }
    .modal-confirm { flex: 1; padding: 11px; border: none; border-radius: 10px; font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; color: white; }
    .modal-confirm.danger  { background: var(--red); }
    .modal-confirm.danger:hover { background: #b91c1c; }
    .modal-confirm.success { background: var(--green); }
    .modal-confirm.success:hover { background: #15803d; }

    @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } .manual-form { position: static; } }
    @media (max-width: 640px) {
      .content, .topbar { padding-left: 14px; padding-right: 14px; }
      .stats-row { gap: 7px; padding: 12px 14px 0; }
      .stat-card { padding: 10px 8px; }
      .stat-val { font-size: 20px; }
      .consult-bar, .no-consult { padding-left: 14px; padding-right: 14px; }
      .consult-number { font-size: 28px; }
      .list-header { display: none; }
      .list-item { display: flex !important; flex-direction: column; gap: 10px; padding: 14px 16px; }
      .list-item.en_cours { border-left: 4px solid var(--orange) !important; }
      .list-item.manuel:not(.en_cours) { border-left: 4px solid var(--blue) !important; }
      .num-badge { flex-shrink: 0; }
      .name-col { flex: 1; }
      .actions-col { display: flex !important; flex-wrap: wrap; gap: 7px; padding-top: 4px; border-top: 1px solid var(--cream); }
      .action-btn { padding: 9px 14px !important; font-size: 12px !important; flex: 1; min-width: 80px; text-align: center; }
      .btn-del { flex: 0 0 auto; min-width: unset; padding: 9px 12px !important; }
    }
  </style>
</head>
<body>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-icon" id="modalIcon">⚠️</div>
    <div class="modal-title" id="modalTitle">Confirmer</div>
    <div class="modal-msg" id="modalMsg">Êtes-vous sûr ?</div>
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closeModal()">Annuler</button>
      <button class="modal-confirm danger" id="modalConfirm" onclick="confirmAction()">Confirmer</button>
    </div>
  </div>
</div>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <div class="login-logo-wrap">
      <div class="login-logo-icon">
        <svg width="18" height="18" viewBox="0 0 22 22" fill="none"><path d="M5 3C5 3 3 3 3 6C3 9 5 9 5 12C5 15.3137 7.68629 18 11 18C14.3137 18 17 15.3137 17 12V10" stroke="white" stroke-width="1.9" stroke-linecap="round"/><circle cx="17" cy="8" r="2.2" stroke="white" stroke-width="1.9"/><path d="M3 6C3 5 2.5 4.5 3 3.5C3.5 3 4.5 3 5 3" stroke="white" stroke-width="1.9" stroke-linecap="round"/><path d="M5 3C5.5 3 6.5 3 7 4C7.5 5 6.5 5.5 6 5" stroke="white" stroke-width="1.9" stroke-linecap="round"/></svg>
      </div>
      <div class="login-logo-text">Rend<span>z</span></div>
    </div>
    <div class="login-role-icon">👩‍⚕️</div>
    <div class="login-role">Espace Assistante</div>
    <input class="login-input" type="password" id="pwdInput" placeholder="Mot de passe" onkeydown="if(event.key==='Enter')login()"/>
    <button class="login-btn" onclick="login()">Se connecter</button>
    <div class="login-err" id="loginErr">Mot de passe incorrect.</div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">
  <div class="topbar">
    <div class="topbar-logo-wrap">
      <div class="topbar-logo-icon">
        <svg width="15" height="15" viewBox="0 0 22 22" fill="none"><path d="M5 3C5 3 3 3 3 6C3 9 5 9 5 12C5 15.3137 7.68629 18 11 18C14.3137 18 17 15.3137 17 12V10" stroke="white" stroke-width="1.9" stroke-linecap="round"/><circle cx="17" cy="8" r="2.2" stroke="white" stroke-width="1.9"/><path d="M3 6C3 5 2.5 4.5 3 3.5C3.5 3 4.5 3 5 3" stroke="white" stroke-width="1.9" stroke-linecap="round"/><path d="M5 3C5.5 3 6.5 3 7 4C7.5 5 6.5 5.5 6 5" stroke="white" stroke-width="1.9" stroke-linecap="round"/></svg>
      </div>
      <div class="topbar-logo-text">Rend<span>z</span></div>
    </div>
    <div class="topbar-right">
      <span class="topbar-date" id="dateDisplay"></span>
      <span class="live-dot"></span>
      <button class="logout-btn" onclick="logout()">Déconnexion</button>
    </div>
  </div>

  <div id="consultBar"></div>

  <div class="stats-row">
    <div class="stat-card"><div class="stat-val" id="statTotal">0</div><div class="stat-lbl">Inscrits</div></div>
    <div class="stat-card"><div class="stat-val" id="statPresent">0</div><div class="stat-lbl">Présents</div></div>
    <div class="stat-card"><div class="stat-val" id="statAbsent">0</div><div class="stat-lbl">Absents</div></div>
    <div class="stat-card"><div class="stat-val" id="statAttente">0</div><div class="stat-lbl">En attente</div></div>
    <div class="stat-card"><div class="stat-val" id="statTermine">0</div><div class="stat-lbl">Terminés</div></div>
  </div>

  <div class="content">
    <div class="two-col">
      <div>
        <div class="section-title">
          File d'attente du jour
          <button class="refresh-btn" onclick="loadList()">↻ Actualiser</button>
        </div>
        <div class="list-wrap">
          <div class="list-header">
            <span>#</span><span>Patient</span>
            <span>Statut</span>
            <span style="text-align:right">Actions</span>
          </div>
          <div id="listBody"></div>
        </div>
      </div>
      <div class="manual-form">
        <h3>➕ Inscrire un patient sur place</h3>
        <div class="mform-group">
          <label class="mform-label">Nom</label>
          <input class="mform-input" type="text" id="mNom" placeholder="Nom du patient" autocomplete="off"/>
        </div>
        <div class="mform-group">
          <label class="mform-label">Prénom</label>
          <input class="mform-input" type="text" id="mPrenom" placeholder="Prénom" autocomplete="off"/>
        </div>
        <div class="mform-group">
          <label class="mform-label">Téléphone (optionnel)</label>
          <input class="mform-input" type="tel" id="mTel" placeholder="0xxxxxxxxx" autocomplete="off"/>
        </div>
        <button class="add-btn" id="addBtn" onclick="inscrireManuel()">➕ Ajouter à la liste</button>
        <div class="add-success" id="addSuccess"></div>
      </div>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://rynxvdqjplqccekulcfe.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5bnh2ZHFqcGxxY2Nla3VsY2ZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxNDY5ODQsImV4cCI6MjA4NzcyMjk4NH0.Ab-HQgVhGzxdyXbY8xeFF0HveQGxstNgEIUeELVPWk8';
  let refreshInterval;
  const cabinetId = new URLSearchParams(window.location.search).get('id') || 'cabinet-001';
  const SL = { en_attente: 'En attente', present: 'Présent', en_cours: 'En consultation', absent: 'Absent', termine: 'Terminé' };

  async function login() {
    const pwd = document.getElementById('pwdInput').value;
    const res = await fetch(`${SUPABASE_URL}/rest/v1/utilisateurs?role=eq.assistante&cabinet_id=eq.${cabinetId}`, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } });
    const data = await res.json();
    if (data.length > 0 && data[0].mot_de_passe === pwd) {
      localStorage.setItem(`rendz_assistante_${cabinetId}`, 'true');
      showDashboard();
    } else { document.getElementById('loginErr').style.display = 'block'; }
  }

  function showDashboard() {
    document.getElementById('loginWrap').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    setDate(); loadList();
    refreshInterval = setInterval(loadList, 15000);
  }

  function logout() {
    clearInterval(refreshInterval);
    localStorage.removeItem(`rendz_assistante_${cabinetId}`);
    document.getElementById('loginWrap').style.display = 'flex';
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('pwdInput').value = '';
    document.getElementById('loginErr').style.display = 'none';
  }

  if (localStorage.getItem(`rendz_assistante_${cabinetId}`)) showDashboard();

  function setDate() {
    document.getElementById('dateDisplay').textContent = new Date().toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });
  }

  async function inscrireManuel() {
    const nom = document.getElementById('mNom').value.trim();
    const prenom = document.getElementById('mPrenom').value.trim();
    const telephone = document.getElementById('mTel').value.trim() || '—';
    if (!nom || !prenom) { alert('Nom et prénom obligatoires.'); return; }
    document.getElementById('addBtn').disabled = true;
    const today = new Date().toISOString().split('T')[0];
    const countRes = await fetch(`${SUPABASE_URL}/rest/v1/inscriptions?cabinet_id=eq.${cabinetId}&date_inscription=eq.${today}&select=id`, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Prefer': 'count=exact' } });
    const countHeader = countRes.headers.get('content-range');
    const currentCount = countHeader ? parseInt(countHeader.split('/')[1]) || 0 : 0;
    const position = currentCount + 1;
    const res = await fetch(`${SUPABASE_URL}/rest/v1/inscriptions`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
      body: JSON.stringify({ nom, prenom, telephone, position, date_inscription: today, statut: 'present', source: 'manuel', cabinet_id: cabinetId })
    });
    if (res.ok) {
      document.getElementById('mNom').value = '';
      document.getElementById('mPrenom').value = '';
      document.getElementById('mTel').value = '';
      const s = document.getElementById('addSuccess');
      s.textContent = `✓ ${nom} ${prenom} — Numéro ${position}`;
      s.style.display = 'block';
      setTimeout(() => s.style.display = 'none', 3000);
      loadList();
    } else { alert('Erreur. Réessayez.'); }
    document.getElementById('addBtn').disabled = false;
  }

  async function loadList() {
    const today = new Date().toISOString().split('T')[0];
    const [listRes, paramRes] = await Promise.all([
      fetch(`${SUPABASE_URL}/rest/v1/inscriptions?cabinet_id=eq.${cabinetId}&date_inscription=eq.${today}&order=position.asc`, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }),
      fetch(`${SUPABASE_URL}/rest/v1/parametres?cabinet_id=eq.${cabinetId}`, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } })
    ]);
    const list = await listRes.json();
    const enCours = list.find(p => p.statut === 'en_cours');
    const consultBar = document.getElementById('consultBar');
    if (enCours) {
      consultBar.innerHTML = `<div class="consult-bar"><div><div class="consult-label">🔴 En consultation</div><div class="consult-number">${enCours.position}</div><div class="consult-name">${enCours.nom} ${enCours.prenom} · ${enCours.telephone}</div></div><button class="fin-btn" onclick="finConsultation(${enCours.id})">✅ Fin de consultation</button></div>`;
    } else {
      consultBar.innerHTML = `<div class="no-consult">⏳ Aucune consultation en cours</div>`;
    }
    document.getElementById('statTotal').textContent = list.length;
    document.getElementById('statPresent').textContent = list.filter(p => p.statut === 'present').length;
    document.getElementById('statAbsent').textContent = list.filter(p => p.statut === 'absent').length;
    document.getElementById('statAttente').textContent = list.filter(p => p.statut === 'en_attente').length;
    document.getElementById('statTermine').textContent = list.filter(p => p.statut === 'termine').length;
    const body = document.getElementById('listBody');
    if (list.length === 0) { body.innerHTML = `<div class="empty-state"><div class="ico">📭</div><p>Aucun patient inscrit pour aujourd'hui.</p></div>`; return; }
    const dejaEnCours = list.some(x => x.statut === 'en_cours');
    body.innerHTML = list.map(p => {
      const st = p.statut || 'en_attente';
      const isM = p.source === 'manuel';
      const bc = st === 'present' ? 'present' : st === 'en_cours' ? 'en_cours' : st === 'absent' ? 'absent' : st === 'termine' ? 'termine' : '';
      const actions = `
        ${st === 'en_attente' ? `<button class="action-btn btn-present" onclick="setStatut(${p.id},'present')">✓ Présent</button>` : ''}
        ${st === 'present' && !dejaEnCours ? `<button class="action-btn btn-encours" onclick="appelConsultation(${p.id},${p.position})">▶ Appeler</button>` : ''}
        ${st === 'en_cours' ? `<button class="action-btn btn-fin" onclick="finConsultation(${p.id})">✅ Fin</button>` : ''}
        ${st !== 'absent' && st !== 'termine' ? `<button class="action-btn btn-absent" onclick="setStatut(${p.id},'absent')">✗ Absent</button>` : ''}
        ${st === 'absent' ? `<button class="action-btn btn-restore" onclick="setStatut(${p.id},'en_attente')">↩ Restaurer</button>` : ''}
        <button class="action-btn btn-del" onclick="supprimer(${p.id})">🗑</button>`;
      return `<div class="list-item ${st} ${isM ? 'manuel' : ''}">
        <div><div class="num-badge ${bc}">${p.position}</div></div>
        <div class="name-col">${p.nom} ${p.prenom}${isM ? '<span class="tag-manuel">Sur place</span>' : ''}<div class="tel">${p.telephone !== '—' ? p.telephone : ''}</div></div>
        <div class="status-col"><span class="status-badge ${st}">${SL[st] || st}</span></div>
        <div class="actions-col">${actions}</div>
      </div>`;
    }).join('');
  }

  async function appelConsultation(id, position) {
    const paramRes = await fetch(`${SUPABASE_URL}/rest/v1/parametres?cabinet_id=eq.${cabinetId}`, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } });
    const params = await paramRes.json();
    const numeroActuel = (params[0] && params[0].numero_en_cours) || 0;
    const updates = [fetch(`${SUPABASE_URL}/rest/v1/inscriptions?id=eq.${id}`, { method: 'PATCH', headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ statut: 'en_cours' }) })];
    if (position > numeroActuel) {
      updates.push(fetch(`${SUPABASE_URL}/rest/v1/parametres?cabinet_id=eq.${cabinetId}`, { method: 'PATCH', headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ numero_en_cours: position }) }));
    }
    await Promise.all(updates);
    loadList();
  }

  let pendingAction = null;

  function showModal(icon, title, msg, confirmClass, action) {
    document.getElementById('modalIcon').textContent = icon;
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalMsg').textContent = msg;
    document.getElementById('modalConfirm').className = `modal-confirm ${confirmClass}`;
    document.getElementById('modalConfirm').textContent = confirmClass === 'danger' ? 'Confirmer' : 'Valider';
    pendingAction = action;
    document.getElementById('modalOverlay').classList.add('show');
  }
  function closeModal() { document.getElementById('modalOverlay').classList.remove('show'); pendingAction = null; }
  async function confirmAction() { const action = pendingAction; closeModal(); if (action) await action(); }

  async function supprimer(id) {
    showModal('🗑️', 'Supprimer ce patient ?', 'Cette action est irréversible.', 'danger',
      async () => { await fetch(`${SUPABASE_URL}/rest/v1/inscriptions?id=eq.${id}`, { method: 'DELETE', headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }); loadList(); }
    );
  }

  async function finConsultation(id) {
    showModal('✅', 'Fin de consultation ?', 'Le patient sera marqué comme terminé.', 'success',
      async () => {
        await fetch(`${SUPABASE_URL}/rest/v1/inscriptions?id=eq.${id}`, { method: 'PATCH', headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ statut: 'termine' }) });
        const today = new Date().toISOString().split('T')[0];
        const res = await fetch(`${SUPABASE_URL}/rest/v1/inscriptions?cabinet_id=eq.${cabinetId}&date_inscription=eq.${today}&select=id,statut`, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } });
        const tous = await res.json();
        const restants = tous.filter(p => p.statut !== 'termine' && p.statut !== 'absent' && p.id !== id);
        if (restants.length === 0) {
          await fetch(`${SUPABASE_URL}/rest/v1/parametres?cabinet_id=eq.${cabinetId}`, { method: 'PATCH', headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ numero_en_cours: 0 }) });
        }
        loadList();
      }
    );
  }

  async function setStatut(id, statut) {
    await fetch(`${SUPABASE_URL}/rest/v1/inscriptions?id=eq.${id}`, { method: 'PATCH', headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ statut }) });
    loadList();
  }

  document.getElementById('modalOverlay').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
  document.getElementById('pwdInput').addEventListener('keydown', e => { if(e.key==='Enter') login(); });
</script>
</body>
